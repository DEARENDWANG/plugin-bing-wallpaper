  issues: https://github.com/DEARENDWANG/plugin-bing-wallpaper/issues
  license:
    - name: "GPL-3.0"
      url: "https://github.com/DEARENDWANG/plugin-bing-wallpaper/blob/main/LICENSE"
  settingName: plugin-bing-wallpaper-settings
  configMapName: plugin-bing-wallpaper-configmap