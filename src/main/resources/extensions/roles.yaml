apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-bing-wallpaper-role-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "Bing 每日一图"
    rbac.authorization.halo.run/display-name: "壁纸查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:plugin-bing-wallpaper:view"]
rules:
  - apiGroups: ["bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    verbs: ["get", "list"]
  # GET 自定义路径被解析为 resource=wallpapers + name，用 resourceNames 限定
  # Halo 2.26 的 resourceNames 只匹配首项，每个名字单独一条规则
  - apiGroups: ["console.api.bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    resourceNames: ["stats"]
    verbs: ["get"]
  - apiGroups: ["console.api.bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    resourceNames: ["export"]
    verbs: ["get"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-bing-wallpaper-role-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      ["plugin-bing-wallpaper-role-view"]
    rbac.authorization.halo.run/module: "Bing 每日一图"
    rbac.authorization.halo.run/display-name: "壁纸管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:plugin-bing-wallpaper:manage"]
rules:
  - apiGroups: ["bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["console.api.bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    verbs: ["delete"]
  # POST 自定义路径按 nonResourceURL 匹配
  - nonResourceURLs:
      - /apis/console.api.bingwallpaper.dearend.wang/v1alpha1/wallpapers/import
      - /apis/console.api.bingwallpaper.dearend.wang/v1alpha1/wallpapers/import-data
      - /apis/console.api.bingwallpaper.dearend.wang/v1alpha1/wallpapers/fetch-today
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-bing-wallpaper-role-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  - apiGroups: ["api.bingwallpaper.dearend.wang"]
    resources: ["wallpapers"]
    verbs: ["get", "list"]