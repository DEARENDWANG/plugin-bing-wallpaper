name: CD

on:
  release:
    types: [published]

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    permissions:
      contents: write
    with:
      ui-path: ui
      node-version: "20"
      pnpm-version: "9"
      app-id: app-ditb0eu3
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}