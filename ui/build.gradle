plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'wang.dearend.bingwallpaper.ui'

node {
    download = true
    version = "20.19.0"
    distBaseUrl = "https://npmmirror.com/mirrors/node/"
    pnpmVersion = "9.15.9"
}

tasks.register('buildFrontend', PnpmTask) {
    group = 'build'
    description = 'Builds the UI project using pnpm.'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
            dir: layout.projectDirectory,
            includes: ['*.cjs', '*.ts', '*.js', '*.json', '*.yaml']))
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('pnpmCheck', PnpmTask) {
    group = 'verification'
    description = 'Runs UI type checks using pnpm.'
    args = ['type-check']
    dependsOn tasks.named('pnpmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('buildFrontend')
}